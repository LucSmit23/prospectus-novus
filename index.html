<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospectus Novus — Catch-up Plan Portal</title>
<style>
  :root{
    --maroon:#902444;
    --maroon-dark:#6c1a34;
    --maroon-deep:#4f1226;
    --maroon-tint:#f7ebee;
    --maroon-tint-2:#f0dbe1;
    --cream:#fbf8f6;
    --paper:#ffffff;
    --ink:#221c1e;
    --ink-soft:#6e6265;
    --line:#e6dcd9;
    --success:#2c6e49;
    --success-bg:#e7f3ea;
    --warn:#a8721f;
    --warn-bg:#fbf0dd;
    --radius:10px;
    --serif: Georgia, 'Times New Roman', Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--serif); margin:0; color:var(--maroon-deep); font-weight:700;}
  a{color:var(--maroon);}
  button{font-family:var(--sans); cursor:pointer;}
  input,select,textarea{font-family:var(--sans); font-size:14.5px;}
  ::selection{background:var(--maroon-tint-2);}

  .visually-hidden{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 18px; border-radius:8px; border:1.5px solid transparent;
    font-size:14px; font-weight:600; letter-spacing:.1px; transition:.15s ease;
    background:var(--maroon); color:#fff;
  }
  .btn:hover{background:var(--maroon-dark);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.secondary{background:#fff; color:var(--maroon); border-color:var(--maroon);}
  .btn.secondary:hover{background:var(--maroon-tint);}
  .btn.ghost{background:transparent; color:var(--ink-soft); border-color:var(--line);}
  .btn.ghost:hover{background:#f2ecea; color:var(--ink);}
  .btn.small{padding:6px 12px; font-size:12.5px; border-radius:7px;}
  .btn.danger{background:#fff; color:#a33; border-color:#e3c6c6;}
  .btn.danger:hover{background:#fdeeee;}
  .btn.block{width:100%;}

  /* ---------- Shield / crest ---------- */
  .crest svg{display:block;}

  /* ---------- Top bar (app) ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 22px; background:var(--paper); border-bottom:2px solid var(--maroon);
  }
  .topbar-left{display:flex; align-items:center; gap:12px;}
  .brandmark{display:flex; flex-direction:column; line-height:1.1;}
  .brandmark .name{font-family:var(--serif); font-weight:700; font-size:17px; letter-spacing:.5px; color:var(--maroon-deep);}
  .brandmark .tag{font-size:10px; color:var(--ink-soft); letter-spacing:.4px; text-transform:uppercase;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .userpill{display:flex; align-items:center; gap:9px; padding:5px 12px 5px 6px; border-radius:999px; background:var(--maroon-tint); border:1px solid var(--maroon-tint-2);}
  .userpill .avatar{width:26px;height:26px;border-radius:50%; background:var(--maroon); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700;}
  .userpill .meta{display:flex; flex-direction:column; line-height:1.15;}
  .userpill .meta .n{font-size:12.5px; font-weight:700; color:var(--ink);}
  .userpill .meta .r{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px;}

  /* ---------- App shell ---------- */
  .shell{display:flex; min-height:calc(100vh - 53px);}
  .sidenav{
    width:220px; flex-shrink:0; background:var(--paper); border-right:1px solid var(--line);
    padding:18px 12px;
  }
  .sidenav .navgroup-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); padding:10px 10px 6px;}
  .navbtn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:10px 12px; border-radius:8px; border:none; background:transparent;
    color:var(--ink); font-size:14px; font-weight:600; margin-bottom:2px;
  }
  .navbtn:hover{background:var(--maroon-tint);}
  .navbtn.active{background:var(--maroon); color:#fff;}
  .navbtn .dot{width:6px;height:6px;border-radius:50%; background:currentColor; opacity:.55;}
  .main{flex:1; padding:26px 30px 60px; max-width:1180px;}

  /* ---------- Cards / panels ---------- */
  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:20px;}
  .panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px;}
  .panel-head h2{font-size:19px;}
  .panel-head p{margin:4px 0 0; color:var(--ink-soft); font-size:13.5px;}
  .subtle{color:var(--ink-soft); font-size:13px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:5px;}
  .field .req{color:var(--maroon);}
  .field input[type=text], .field input[type=email], .field input[type=password], .field input[type=date], .field input[type=number], .field select, .field textarea{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--maroon);}
  .field textarea{resize:vertical; min-height:64px;}
  .field.error input, .field.error select, .field.error textarea{border-color:#c25050; background:#fff7f7;}
  .field .errmsg{color:#a33; font-size:11.5px; margin-top:4px; display:none;}
  .field.error .errmsg{display:block;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}

  .errorbanner{background:#fdecec; border:1px solid #eec2c2; color:#8a2f2f; padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none;}
  .errorbanner.show{display:block;}
  .okbanner{background:var(--success-bg); border:1px solid #cfe6d7; color:var(--success); padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.2px;}
  .badge.ok{background:var(--success-bg); color:var(--success);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .badge.neutral{background:#eee; color:#666;}

  /* ---------- Auth screen ---------- */
  .authwrap{min-height:100vh; display:flex; align-items:stretch; justify-content:center; padding:34px 18px;}
  .authcard{display:flex; width:100%; max-width:920px; margin:auto; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(76,20,40,.14); border:1px solid var(--line);}
  .authbrand{width:40%; background:linear-gradient(165deg, var(--maroon) 0%, var(--maroon-deep) 100%); color:#fff; padding:38px 30px; display:flex; flex-direction:column; justify-content:space-between;}
  .authbrand .crest{margin-bottom:18px;}
  .authbrand h1{color:#fff; font-size:23px; letter-spacing:.6px; line-height:1.25;}
  .authbrand .sub{font-size:12px; opacity:.88; margin-top:8px; letter-spacing:.3px;}
  .authbrand .contact{font-size:11.5px; opacity:.85; line-height:1.7; margin-top:26px;}
  .authbrand .contact div b{font-weight:700; opacity:.95;}
  .authform{width:60%; background:#fff; padding:34px 34px 30px;}
  .tabs{display:flex; gap:4px; background:var(--maroon-tint); padding:4px; border-radius:9px; margin-bottom:22px;}
  .tabbtn{flex:1; padding:9px 8px; border:none; background:transparent; border-radius:7px; font-size:13px; font-weight:700; color:var(--maroon-dark);}
  .tabbtn.active{background:var(--maroon); color:#fff;}
  .authtitle{font-size:19px; margin-bottom:3px;}
  .authswitch{margin-top:16px; font-size:13px; color:var(--ink-soft); text-align:center;}
  .authswitch button{background:none;border:none;color:var(--maroon); font-weight:700; padding:0;}

  /* ---------- Timetable ---------- */
  .day-block{border:1px solid var(--line); border-radius:9px; margin-bottom:14px; overflow:hidden;}
  .day-head{display:flex; align-items:center; justify-content:space-between; background:var(--maroon-tint); padding:9px 14px;}
  .day-head h4{font-size:13.5px; color:var(--maroon-deep); letter-spacing:.3px;}
  .period-row{display:grid; grid-template-columns:1.1fr 1fr 1.4fr 34px; gap:8px; padding:8px 14px; border-top:1px solid var(--line); align-items:center;}
  .period-row input{padding:7px 9px; border:1.3px solid var(--line); border-radius:6px; font-size:13px;}
  .period-row .rm{background:none;border:none;color:#a35;font-size:16px; font-weight:700; width:28px; height:28px; border-radius:6px;}
  .period-row .rm:hover{background:#fdeaea;}
  .addperiod{padding:9px 14px;}

  /* ---------- Date chips ---------- */
  .datechips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px;}
  .chip{display:flex; align-items:center; gap:8px; background:var(--maroon-tint); border:1px solid var(--maroon-tint-2); color:var(--maroon-deep); padding:6px 8px 6px 12px; border-radius:999px; font-size:12.5px; font-weight:700;}
  .chip button{background:none; border:none; color:var(--maroon); font-weight:900; width:18px;height:18px; border-radius:50%;}
  .chip button:hover{background:#fff;}

  /* ---------- Lesson block ---------- */
  .lesson-card{border:1.5px solid var(--line); border-radius:10px; padding:16px 16px 14px; margin-bottom:14px; background:#fffdfc;}
  .lesson-card .lhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .lesson-card .lhead .lh-l{display:flex; align-items:center; gap:10px;}
  .lesson-card .lhead .badgeicon{width:26px;height:26px;flex-shrink:0;}
  .lesson-card .lhead h4{font-size:14px; color:var(--ink);}
  .lesson-card .lhead .lsub{font-size:12px; color:var(--ink-soft);}
  .completed-toggle{display:flex; gap:8px; margin-bottom:12px;}
  .toggle-opt{flex:1; text-align:center; padding:9px; border-radius:7px; border:1.5px solid var(--line); font-size:13px; font-weight:700; color:var(--ink-soft); background:#fff;}
  .toggle-opt.sel-yes{border-color:var(--success); color:var(--success); background:var(--success-bg);}
  .toggle-opt.sel-no{border-color:var(--warn); color:var(--warn); background:var(--warn-bg);}
  .catchup-fields{border-top:1px dashed var(--line); padding-top:12px; margin-top:4px;}

  .periodpicklist{display:flex; flex-direction:column; gap:8px;}
  .periodpick{display:flex; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:8px; padding:10px 12px;}
  .periodpick.checked{border-color:var(--maroon); background:var(--maroon-tint);}
  .periodpick .pp-info{flex:1; font-size:13px;}
  .periodpick .pp-info b{color:var(--ink);}
  .periodpick input[type=checkbox]{width:18px;height:18px; accent-color:var(--maroon);}

  .counter-pill{display:inline-flex; align-items:center; gap:6px; background:var(--maroon-tint); color:var(--maroon-deep); font-weight:700; font-size:12.5px; padding:6px 12px; border-radius:999px;}
  .counter-pill.full{background:var(--warn-bg); color:var(--warn);}

  /* ---------- Tables ---------- */
  table.list{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.list th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); padding:9px 10px; border-bottom:2px solid var(--line);}
  table.list td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.list tr:hover td{background:#faf6f5;}
  .emptystate{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .emptystate .crest{opacity:.35; margin:0 auto 12px;}

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .filters input, .filters select{padding:8px 10px; border:1.5px solid var(--line); border-radius:7px; font-size:13px;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(40,20,26,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:34px 16px; overflow:auto;}
  .modal{background:#fff; border-radius:12px; width:100%; max-width:760px; max-height:none; box-shadow:0 30px 70px rgba(0,0,0,.3);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; border-radius:12px 12px 0 0;}
  .modal-body{padding:20px;}
  .modal-close{background:none;border:none;font-size:20px; color:var(--ink-soft); width:32px;height:32px;border-radius:8px;}
  .modal-close:hover{background:#f2ecea;}

  .kv-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px;}
  .kv{background:var(--maroon-tint); border-radius:8px; padding:10px 12px;}
  .kv .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--maroon-dark); font-weight:700;}
  .kv .v{font-size:14px; color:var(--ink); margin-top:2px; font-weight:600;}

  .plandoc-lesson{border:1.5px solid var(--line); border-radius:9px; padding:14px; margin-bottom:12px; break-inside:avoid;}
  .plandoc-lesson .plh{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .plandoc-lesson .plh .t{font-weight:700; font-size:13.5px;}
  .plandoc-lesson dl{margin:0; display:grid; grid-template-columns:170px 1fr; gap:6px 10px; font-size:13px;}
  .plandoc-lesson dt{color:var(--ink-soft); font-weight:600;}
  .plandoc-lesson dd{margin:0;}

  .banner-note{background:var(--maroon-tint); border:1px solid var(--maroon-tint-2); color:var(--maroon-deep); font-size:12.5px; padding:10px 14px; border-radius:8px; margin-bottom:16px;}

  /* ---------- Print ---------- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:10mm;}
    .no-print{display:none !important;}
  }
  .print-letterhead{display:flex; align-items:center; gap:16px; border-bottom:2.5px solid var(--maroon); padding-bottom:12px; margin-bottom:16px;}
  .print-letterhead h1{font-size:20px; letter-spacing:1px;}
  .print-letterhead .ptag{font-size:10.5px; letter-spacing:.3px; color:var(--ink-soft); margin-top:2px;}
  .print-letterhead .pcontact{margin-left:auto; text-align:right; font-size:10px; color:var(--ink-soft); line-height:1.6;}

  @media (max-width: 900px){
    .shell{flex-direction:column;}
    .sidenav{width:100%; display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); padding:10px;}
    .navbtn{white-space:nowrap;}
    .main{padding:18px 14px 50px;}
    .authcard{flex-direction:column; max-width:480px;}
    .authbrand, .authform{width:100%;}
    .row2, .row3, .kv-grid{grid-template-columns:1fr;}
    .period-row{grid-template-columns:1fr;}
  }
</style>

<script>
const SUPABASE_URL = 'https://vbggqralpqhioejsunng.supabase.co';
const SUPABASE_KEY = 'sb_publishable_JCGWtb8AXGXr2zEq3AipuA_MQzE0PAC';

/* =========================================================================

   Single-file app. Data is stored via window.storage (shared = school-wide).

const SMT_ACCESS_CODE = "PNSMT2026"; // share this with department heads / principal only

const DEPARTMENTS = ["Foundation Phase","Intersen Phase","ASD Unit"];
const POSITIONS = ["Principal","Deputy Principal","Head of Department – Foundation Phase","Head of Department – Intersen Phase","Head of Department – ASD Unit","SMT Member"];
const TERMS = ["Term 1","Term 2","Term 3","Term 4"];
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

/* ---------------- utilities ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-ZA', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}
function weekdayName(iso){
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return "";
  const names = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  return names[d.getDay()];
}
function nowStamp(){
  return new Date().toLocaleString('en-ZA', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

/* ---------------- storage helpers ---------------- */
async function storeSet(key, obj){

  // USER
  if(key.startsWith("user:")){
    const { error } = await window.db
      .from("users")
      .upsert(obj, { onConflict: "email" });
if (error) {
    alert("SAVE USER ERROR:\n" + JSON.stringify(error, null, 2));
    console.error(error);
    return null;
}
    return obj;
  }

  // PLAN
  if(key.startsWith("plan:")){
    const { error } = await window.db
      .from("plans")
      .upsert({
        id: obj.id,
        teacheremail: obj.teacherEmail,
        teachername: obj.teacherName,
        submittedbyname: obj.submittedByName,
        term: obj.term,
        atpweek: obj.atpWeek,
        dates: obj.dates,
        lessons: obj.lessons,
        timetable: obj.timetable,
        createdat: obj.createdAt,
        data: obj
      });

    if(error){
      console.error(error);
      return null;
    }

    return obj;
  }

  // TIMETABLE
  if(key.startsWith("timetable:")){
    const { error } = await window.db
      .from("timetables")
      .upsert({
        email: obj.email,
        timetable: obj.timetable,
        updatedat: Date.now()
      });

    if(error){
      console.error(error);
      return null;
    }

    return obj;
  }

  return null;
}
async function storeDelete(key){
  try{ return await window.storage.delete(key, true); } catch(e){ return null; }
}
async function storeListValues(prefix){
  try{
    const r = await window.storage.list(prefix, true);
    if(!r || !r.keys) return [];
    const out = [];
    for(const k of r.keys){
      const v = await storeGet(k);
      if(v) out.push(v);
    }
    return out;
  }catch(e){ return []; }
}

function userKey(email){ return "user:"+email.trim().toLowerCase(); }
function planKey(email,id){ return "plan:"+email.trim().toLowerCase()+":"+id; }

async function getUser(email){
    const { data, error } = await window.db
        .from("users")
        .select("*")
        .eq("email", email.trim().toLowerCase())
        .maybeSingle();

    if (error) {
        alert("GET USER ERROR:\n" + JSON.stringify(error, null, 2));
        return null;
    }

    return data;
}
async function saveUser(u){
console.log("Saving user:", u);
    const { error } = await window.db
        .from("users")
        .upsert([u], {
            onConflict: "email"
        });

   if (error) {
    alert(JSON.stringify(error, null, 2));
    console.error(error);
    return null;
}

    return u;
}
async function listAllUsers(){

    const { data, error } = await window.db
        .from("users")
        .select("*");

    if(error){
        console.error(error);
        return [];
    }

    return data || [];
}
async function savePlan(p){

    const { error } = await window.db
        .from("plans")
        .upsert([{
            id: p.id,
            teacheremail: p.teacherEmail,
            data: p
        }]);

    if(error){
        console.error(error);
        return null;
    }

    return p;
}
async function listPlansForTeacher(email){

    const { data, error } = await window.db
        .from("plans")
        .select("data")
        .eq("teacheremail", email.trim().toLowerCase());

    if(error){
        console.error(error);
        return [];
    }

    return (data || [])
        .map(r => r.data)
        .sort((a,b) => b.createdAt - a.createdAt);
}
async function listAllPlans(){

    const { data, error } = await window.db
        .from("plans")
        .select("data");

    if(error){
        console.error(error);
        return [];
    }

    return (data || [])
        .map(r => r.data)
        .sort((a,b) => b.createdAt - a.createdAt);
}

/* ---------------- app state ---------------- */
const state = {
  screen: 'auth',            // 'auth' | 'app'
  authTab: 'educator',       // 'educator' | 'smt'
  authMode: 'login',         // 'login' | 'register'
  currentUser: null,
  appTab: null,               // set on login
  draftPlan: null,            // in-progress new plan
  allUsersCache: [],
  allPlansCache: [],
};

function crestSVG(size, onDark){
  size = size || 48;
  const h = Math.round(size*1.2);
  const img = `<img src="${CREST_DATA_URI}" alt="Prospectus Novus crest" style="display:block; width:${size}px; height:${h}px; object-fit:contain;">`;
  if(onDark){
    const pad = Math.max(6, Math.round(size*0.16));
    return `<div class="crest" style="width:${size+pad*2}px;"><div style="background:#fff; border-radius:12px; padding:${pad}px; display:inline-flex; box-shadow:0 6px 18px rgba(0,0,0,.18);">${img}</div></div>`;
  }
  return `<div class="crest" style="width:${size}px;">${img}</div>`;
}

function render(){

}

  if(toReg) toReg.addEventListener('click', ()=>{ state.authMode='register'; render(); });

  <div class="topbar">

      ${personalNav.map(n=>`<button class="navbtn ${state.appTab===n.id?'active':''}" data-tab="${n.id}"><span class="dot"></span>${n.label}</button>`).join('')}

      <div class="navgroup-label" style="margin-top:10px;">SMT Overview</div>

      ` : ``}
    </div>
    <div class="main" id="mainArea">
      ${renderTabContent()}
    </div>
  </div>
  <div id="modalRoot"></div>
  `;
}

function renderTabContent(){
  const tab = state.appTab;
  if(tab==='newplan') return renderNewPlanTab();
  if(tab==='myplans') return `<div id="myplansWrap">${loadingPanel()}</div>`;
  if(tab==='profile') return renderProfileTab();
  if(tab==='allplans') return `<div id="allplansWrap">${loadingPanel()}</div>`;
  if(tab==='teachers') return `<div id="teachersWrap">${loadingPanel()}</div>`;
  return '';
}
function loadingPanel(){ return `<div class="panel"><p class="subtle">Loading…</p></div>`; }

function bindAppEvents(){
  document.getElementById('btnLogout').addEventListener('click', ()=>{
    state.currentUser = null; state.screen = 'auth'; state.authMode='login'; state.draftPlan=null;
    render();
  });
  document.querySelectorAll('.navbtn').forEach(b=>{
    b.addEventListener('click', ()=>{ state.appTab = b.dataset.tab; state.draftPlan=null; render(); });
  });

  const tab = state.appTab;
  if(tab==='newplan') bindNewPlanEvents();
  if(tab==='profile') bindProfileEvents();
  if(tab==='myplans') loadMyPlans();
  if(tab==='allplans') loadAllPlans();
  if(tab==='teachers') loadTeachers();
}

/* =========================================================================
   PROFILE & TIMETABLE (educator)
   ========================================================================= */
function ensureTimetableShape(tt){
  tt = tt || {};
  DAYS.forEach(d=>{ if(!Array.isArray(tt[d])) tt[d] = []; });
  return tt;
}

function renderProfileTab(){
  const u = state.currentUser;
  const tt = ensureTimetableShape(u.timetable);
  return `
  <div class="panel">
    <div class="panel-head">
      <div><h2>My profile</h2><p>These details are filled in automatically on every catch-up plan you submit.</p></div>
    </div>
    <div id="profileError" class="errorbanner"></div>
    <div class="row3">
      <div class="field"><label>Full name</label><input type="text" id="pfName" value="${esc(u.name)}"></div>
      <div class="field"><label>Email</label><input type="text" value="${esc(u.email)}" disabled></div>
      ${u.role==='smt' ? `<div class="field"><label>SMT position</label><input type="text" value="${esc(u.position||'')}" disabled></div>` : ``}
    </div>
    <div class="field" style="max-width:340px;">
      <label>${u.role==='smt' ? 'Department / phase you teach in (used on your own catch-up plans)' : 'Department'}</label>
      <select id="pfDept">${DEPARTMENTS.map(d=>`<option value="${d}" ${u.department===d?'selected':''}>${d}</option>`).join('')}</select>
    </div>
    <button class="btn secondary small" id="btnSaveProfile">Save profile details</button>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div><h2>My timetable</h2><p>Add each period you teach per day, with the grade and subject. This lets your catch-up plans fill in automatically — edit it any time your timetable changes.</p></div>
    </div>
    <div id="timetableWrap">
      ${DAYS.map(day=>renderDayBlock(day, tt[day])).join('')}
    </div>
    <div class="banner-note">Tip: you only need to set this up once. If your timetable changes, come back to this page and edit it — new catch-up plans will use the updated version.</div>
    <button class="btn small" id="btnSaveTimetable">Save timetable</button>
  </div>
  `;
}

function renderDayBlock(day, periods){
  return `
  <div class="day-block" data-day="${day}">
    <div class="day-head"><h4>${day}</h4><span class="subtle">${periods.length} period${periods.length===1?'':'s'}</span></div>
    <div class="periods-list">
      ${periods.map(p=>renderPeriodRow(day,p)).join('')}
    </div>
    <div class="addperiod"><button class="btn ghost small" data-addperiod="${day}">+ Add period</button></div>
  </div>`;
}
function renderPeriodRow(day, p){
  return `
  <div class="period-row" data-day="${day}" data-pid="${p.id}">
    <input type="text" class="pt-period" placeholder="Period name (e.g. Period 1)" value="${esc(p.period||'')}">
    <input type="text" class="pt-grade" placeholder="Grade (e.g. Grade 4)" value="${esc(p.grade||'')}">
    <input type="text" class="pt-subject" placeholder="Subject (e.g. Mathematics)" value="${esc(p.subject||'')}">
    <button class="rm" data-rmperiod="${day}|${p.id}" title="Remove period">×</button>
  </div>`;
}

function bindProfileEvents(){
  document.getElementById('btnSaveProfile').addEventListener('click', async ()=>{
    const name = document.getElementById('pfName').value.trim();
    const dept = document.getElementById('pfDept').value;
    const errEl = document.getElementById('profileError');
    if(!name){ errEl.textContent="Please enter your name."; errEl.classList.add('show'); return; }
    errEl.classList.remove('show');
    state.currentUser.name = name;
    state.currentUser.department = dept;
    await saveUser(state.currentUser);
    render();
  });

  document.querySelectorAll('[data-addperiod]').forEach(b=>{
  b.addEventListener('click', ()=>{

    const tt = ensureTimetableShape({});

    document.querySelectorAll('.day-block').forEach(block=>{
      const day = block.dataset.day;

      block.querySelectorAll('.period-row').forEach(row=>{
        tt[day].push({
          id: row.dataset.pid,
          period: row.querySelector('.pt-period').value.trim(),
          grade: row.querySelector('.pt-grade').value.trim(),
          subject: row.querySelector('.pt-subject').value.trim()
        });
      });
    });

    const day = b.dataset.addperiod;

    tt[day].push({
      id: uid(),
      period: `Period ${tt[day].length + 1}`,
      grade: "",
      subject: ""
    });

    state.currentUser.timetable = tt;
    render();
  });
});
  document.querySelectorAll('[data-rmperiod]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [day,pid] = b.dataset.rmperiod.split('|');
      const tt = ensureTimetableShape(state.currentUser.timetable);
      tt[day] = tt[day].filter(p=>p.id!==pid);
      state.currentUser.timetable = tt;
      render();
    });
  });

  const btnSaveTT = document.getElementById('btnSaveTimetable');
  if(btnSaveTT){
    btnSaveTT.addEventListener('click', async ()=>{
      const tt = ensureTimetableShape({});
      document.querySelectorAll('.day-block').forEach(block=>{
        const day = block.dataset.day;
        const rows = block.querySelectorAll('.period-row');
        rows.forEach(row=>{
          const pid = row.dataset.pid;
          tt[day].push({
            id: pid,
            period: row.querySelector('.pt-period').value.trim(),
            grade: row.querySelector('.pt-grade').value.trim(),
            subject: row.querySelector('.pt-subject').value.trim(),
          });
        });
      });
      state.currentUser.timetable = tt;
      btnSaveTT.disabled = true; btnSaveTT.textContent = "Saving…";
      await saveUser(state.currentUser);
      btnSaveTT.disabled = false; btnSaveTT.textContent = "Saved ✓";
      setTimeout(()=>{ if(document.getElementById('btnSaveTimetable')) document.getElementById('btnSaveTimetable').textContent = "Save timetable"; }, 1600);
    });
  }
}

    atpWeek: '',
    dates: [],       // array of ISO date strings
    lessons: [],      // { id, date, day, period, grade, subject, topic, completed, method, details, resources, dueDate, manual }

}

  return `

function validateDraft(){
  const d = state.draftPlan;
  let ok = true;
  const errors = [];
  if(!d.term){ ok=false; errors.push("Please choose a term."); }
  if(!d.atpWeek || !d.atpWeek.trim()){ ok=false; errors.push("Please enter the ATP week."); }
  if(d.dates.length===0){ ok=false; errors.push("Please add at least one date of absence."); }
  if(d.lessons.length===0){ ok=false; errors.push("Please select or add at least one lesson."); }

  d.lessons.forEach(l=>{
    l._err_topic = l._err_method = l._err_due = l._err_details = l._err_resources = false;
    if(!l.topic || !l.topic.trim()){ ok=false; l._err_topic=true; }
    if(!l.completed){ ok=false; }
    if(l.completed==='no'){
      if(!l.method){ ok=false; l._err_method=true; }
      if(!l.dueDate){ ok=false; l._err_due=true; }
      if(!l.details || !l.details.trim()){ ok=false; l._err_details=true; }
      if(!l.resources || !l.resources.trim()){ ok=false; l._err_resources=true; }
    }
  });
  if(d.lessons.some(l=>!l.completed)) errors.push("Please mark whether work was completed before the absence, for every lesson.");
  if(!ok && errors.length===0) errors.push("Please complete all required fields, highlighted in red below.");
  return {ok, errors};
}

async function submitPlan(){
  const {ok, errors} = validateDraft();
  const errEl = document.getElementById('planError');
  if(!ok){
    errEl.innerHTML = errors.map(e=>`• ${esc(e)}`).join('<br>');
    errEl.classList.add('show');
    render();
    errEl.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const d = state.draftPlan;
  d.createdAt = Date.now();
  d.submittedByName = state.currentUser.name;
  d.teacherName = state.currentUser.name;
  d.teacherEmail = state.currentUser.email;

  const btn = document.getElementById('btnSubmitPlan');
  btn.disabled = true; btn.textContent = "Submitting…";
  await savePlan(d);
  btn.disabled = false;

  const submittedPlan = d;
  state.draftPlan = null;
  state.appTab = 'myplans';
  render();
  setTimeout(()=>{
    const wrap = document.getElementById('myplansWrap');
    if(wrap) wrap.insertAdjacentHTML('afterbegin', `<div class="okbanner">Catch-up plan submitted successfully for ${submittedPlan.dates.length} day(s) and ${submittedPlan.lessons.length} lesson(s).</div>`);
  }, 300);
}

function bindAllPlansEvents(plans){
  function applyFilters(){
    const name = document.getElementById('filterName').value.trim().toLowerCase();
    const dept = document.getElementById('filterDept').value;
    const term = document.getElementById('filterTerm').value;
    const status = document.getElementById('filterStatus').value;
    let filtered = plans.filter(p=>{
      if(name && !p.teacherName.toLowerCase().includes(name)) return false;
      if(dept && p.department!==dept) return false;
      if(term && p.term!==term) return false;
      if(status){
        const pending = p.lessons.some(l=>l.completed==='no');
        if(status==='pending' && !pending) return false;
        if(status==='done' && pending) return false;
      }
      return true;
    });
    const tw = document.getElementById('allPlansTableWrap');
    tw.innerHTML = renderPlansPanelInner(filtered, {showTeacher:true});
    bindPlansListEvents(filtered);
  }
  ['filterName','filterDept','filterTerm','filterStatus'].forEach(id=>{
    document.getElementById(id).addEventListener('input', applyFilters);
    document.getElementById(id).addEventListener('change', applyFilters);
  });
  applyFilters();
}

    </div>
  </div>`;
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('btnDownloadPlan').addEventListener('click', ()=>printPlan(plan));
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function renderPlanDocBody(plan){
  const pending = plan.lessons.filter(l=>l.completed==='no').length;
  return `
  <div class="kv-grid">
    <div class="kv"><div class="k">Teacher</div><div class="v">${esc(plan.teacherName)}</div></div>
    <div class="kv"><div class="k">Department</div><div class="v">${esc(plan.department)}</div></div>
    <div class="kv"><div class="k">Term / ATP Week</div><div class="v">${esc(plan.term)} · ${esc(plan.atpWeek)}</div></div>
    <div class="kv"><div class="k">Email</div><div class="v" style="font-size:12.5px;">${esc(plan.teacherEmail)}</div></div>
    <div class="kv"><div class="k">Dates of absence</div><div class="v" style="font-size:12.5px;">${plan.dates.map(fmtDate).join(', ')}</div></div>
    <div class="kv"><div class="k">Status</div><div class="v">${pending>0?`${pending} lesson(s) need catch-up`:'All work completed'}</div></div>
  </div>
  <h3 style="font-size:14.5px; margin-bottom:10px;">Lessons (${plan.lessons.length})</h3>
  ${plan.lessons.map(l=>`
    <div class="plandoc-lesson">
      <div class="plh"><span class="t">${esc(l.period)} — ${esc(l.grade)} ${esc(l.subject)} · ${fmtDate(l.date)}</span>
        ${l.completed==='no'?'<span class="badge warn">Catch-up needed</span>':'<span class="badge ok">Completed</span>'}</div>
      <dl>
        <dt>Topic / work covered</dt><dd>${esc(l.topic)}</dd>
        ${l.completed==='no' ? `
        <dt>Catch-up method</dt><dd>${esc(l.method)}</dd>
        <dt>Catch-up details</dt><dd>${esc(l.details)}</dd>
        <dt>Resources needed</dt><dd>${esc(l.resources)}</dd>
        <dt>Due date</dt><dd>${fmtDate(l.dueDate)}</dd>
        ` : ``}
      </dl>
    </div>
  `).join('')}
  <p class="subtle" style="margin-top:10px;">Submitted ${nowStampFor(plan.createdAt)}</p>
  `;
}
function nowStampFor(ts){
  return new Date(ts).toLocaleString('en-ZA', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

function printPlan(plan){
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <div class="print-letterhead">
      ${crestSVG(50)}
      <div>
        <h1>PROSPECTUS NOVUS</h1>
        <div class="ptag">Skool vir leerders met leerhindernisse / School for learners with barriers to learning</div>
      </div>
      <div class="pcontact">
        Tel: (012) 335-5109 / (012) 335-4322<br>
        admin@prospectusnovus.co.za<br>
        Fred Nicholson Street, Mayville, Pretoria
      </div>
    </div>
    <h2 style="font-size:16px; margin-bottom:10px;">Teacher's Catch-up Plan for Monitoring, Reflecting &amp; Responding</h2>
    ${renderPlanDocBody(plan)}
  `;
  window.print();
}

/* =========================================================================
   INIT
   ========================================================================= */
render();
</script>
</body>
